<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-label="MADO logo">
  <!-- 窓枠(ディープティール) -->
  <rect x="6" y="6" width="84" height="84" rx="14" fill="#0E5C63"/>
  <!-- 4分割の窓ガラス(ライトブルー) -->
  <rect x="14" y="14" width="32" height="32" rx="5" fill="#DCEFFB"/>
  <rect x="50" y="14" width="32" height="32" rx="5" fill="#DCEFFB"/>
  <rect x="14" y="50" width="32" height="32" rx="5" fill="#DCEFFB"/>
  <rect x="50" y="50" width="32" height="32" rx="5" fill="#DCEFFB"/>
  <!-- 下段の窓越しに昇る朝日(アンバー) -->
  <clipPath id="paneL"><rect x="14" y="50" width="32" height="32" rx="5"/></clipPath>
  <clipPath id="paneR"><rect x="50" y="50" width="32" height="32" rx="5"/></clipPath>
  <g clip-path="url(#paneL)"><circle cx="48" cy="84" r="22" fill="#F4A024"/></g>
  <g clip-path="url(#paneR)"><circle cx="48" cy="84" r="22" fill="#F4A024"/></g>
  <!-- 光の筋 -->
  <g stroke="#F4A024" stroke-width="3" stroke-linecap="round" opacity="0.9">
    <line x1="48" y1="54" x2="48" y2="58"/>
    <line x1="33" y1="60" x2="36" y2="63"/>
    <line x1="63" y1="60" x2="60" y2="63"/>
  </g>
</svg>
